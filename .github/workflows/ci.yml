name: CI

# Merged from two versions during the release/play-v1 merge:
#  - the strict analyze/test/rules gates added on release/play-v1
#  - the signed release build that already existed on main
# Both are kept. See RELEASE_NOTES_FOR_AHMED.md, Decision 11.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

concurrency:
  # One run per branch: a new push cancels the in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the version recorded in RELEASE_NOTES_FOR_AHMED.md.
  # Pinned so CI cannot start failing because the stable channel moved.
  # 3.47.9 is required: Gradle 8.14 and the current Firebase plugins do not
  # build on the 3.35.x this workflow used before.
  FLUTTER_VERSION: 3.47.9

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        # Checks only; it never rewrites files in CI.
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        # The project is at zero issues, so any new warning fails the build.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

  firestore-rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore-tests/package.json

      - name: Set up JDK
        # The Firestore emulator is a Java process. firebase-tools 15 refuses
        # to start on anything older than Java 21. (The Android job below
        # stays on 17, which is what the Gradle build targets.)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: firestore-tests
        run: npm install

      - name: Run rules tests against the emulator
        working-directory: firestore-tests
        # Emulator only; it never touches the live Firebase project.
        # Pinned to a major version: @latest is how a Java 21 requirement
        # arrived unannounced and broke this job.
        run: npx -y firebase-tools@15 emulators:exec --only firestore --project baby-vax-rules-test "node --test rules.test.mjs"

  android-build:
    name: Android release build
    needs: [analyze-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Which kind of build this run makes is decided by the EVENT, never by
      # whether secrets happen to be present. That way a missing or broken
      # secret fails loudly instead of quietly producing a debug-signed build.
      #
      #   signed         push to main, or a manual "Run workflow" on any branch
      #                  -> all four secrets required, verified, output checked
      #   compile-check  pull requests and release/** pushes
      #                  -> no secrets touched, debug-signed, NOTHING uploaded
      #
      # Keeping secrets out of PR runs also means a PR that edits the build
      # scripts can never read the upload key.
      - name: Decide signing mode
        id: signing
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; }; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "Signed release build: all signing secrets are required."
          else
            echo "mode=compile-check" >> "$GITHUB_OUTPUT"
            echo "::notice::Compile check only ($EVENT on $REF): debug-signed, not uploaded. Signed builds run on push to main or via Run workflow."
          fi

      # ---- signed path ----

      - name: Verify signing secrets and write key.properties
        if: steps.signing.outputs.mode == 'signed'
        # Fails with a named error if any secret is missing, the base64 is
        # corrupt, a password is wrong, the alias is absent, or the key is a
        # debug key. Secrets reach the script via env only, never inlined into
        # the shell source, so special characters cannot break or inject.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: bash scripts/ci/android-signing.sh prepare

      - name: Build signed AAB
        if: steps.signing.outputs.mode == 'signed'
        # --obfuscate with --split-debug-info keeps the symbols needed to read
        # Crashlytics stack traces from this build; they are uploaded below.
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/debug-symbols

      - name: Build signed APK
        if: steps.signing.outputs.mode == 'signed'
        # Handy for manual testing outside Play. Split per ABI so each file is
        # what one phone would actually install.
        run: |
          flutter build apk --release --split-per-abi \
            --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/debug-symbols

      - name: Check artifacts are signed by the upload key
        if: steps.signing.outputs.mode == 'signed'
        # Belt and braces: refuse to upload anything unsigned, debug-signed,
        # or signed by a different key than the one in the secrets.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          bash scripts/ci/android-signing.sh verify-artifact \
            build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/flutter-apk/app-*-release.apk

      - name: Upload signed AAB
        if: steps.signing.outputs.mode == 'signed'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed APKs
        if: steps.signing.outputs.mode == 'signed'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug symbols
        if: steps.signing.outputs.mode == 'signed'
        # Without these an obfuscated release crash report is unreadable.
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/debug-symbols/
          if-no-files-found: warn
          retention-days: 90

      - name: Remove signing material
        # Runs even if a build step failed, so nothing is left in the
        # workspace for later steps to pick up.
        if: always() && steps.signing.outputs.mode == 'signed'
        run: rm -f android/app/baby-vax-release-key.jks android/key.properties

      # ---- compile-check path (pull requests, release/** pushes) ----

      - name: Compile-check the release bundle (debug-signed, not uploaded)
        if: steps.signing.outputs.mode == 'compile-check'
        # Proves the release build compiles, shrinks, obfuscates and packages
        # exactly like the real one. Deliberately not uploaded anywhere: a
        # debug-signed bundle must never be mistaken for a release.
        run: |
          flutter build appbundle --release -PdebugSignRelease=true \
            --obfuscate --split-debug-info=build/debug-symbols
          ls -l build/app/outputs/bundle/release/

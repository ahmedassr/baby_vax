name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

concurrency:
  # One run per branch: a new push cancels the in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so CI cannot start failing because the stable channel moved.
          # Keep in step with the version in RELEASE_NOTES_FOR_AHMED.md.
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        # Checks only; it never rewrites files in CI.
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        # The project is at zero issues, so any new warning fails the build.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

  firestore-rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore-tests/package.json

      - name: Set up JDK
        # The Firestore emulator is a Java process.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: firestore-tests
        run: npm install

      - name: Run rules tests against the emulator
        working-directory: firestore-tests
        # Uses the emulator only; it never touches the live Firebase project.
        run: npx -y firebase-tools@latest emulators:exec --only firestore --project baby-vax-rules-test "node --test rules.test.mjs"

  android-build:
    name: Android release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release bundle
        # Debug-signed: CI has no upload keystore, and signing keys must never
        # live in the repo or in Actions. This proves the release build
        # compiles, shrinks and packages; the uploadable AAB is built on
        # Ahmed's machine with the real key. See RELEASE_NOTES_FOR_AHMED.md.
        run: flutter build appbundle --release -PdebugSignRelease=true

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-debug-signed-aab
          path: build/app/outputs/bundle/release/*.aab
          # Not uploadable to Play; for inspection only.
          if-no-files-found: error
          retention-days: 14

name: CI

# يشتغل مع كل push أو Pull Request على main، وأيضاً يدوياً من تبويب Actions لو حبيت
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Analyze, Test, Build APK
    runs-on: ubuntu-latest   # Linux runner كافي لـ Android، أرخص وأسرع من macOS

    steps:
      # 1. تحميل الكود
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت Flutter SDK وعمل cache تلقائي لتسريع البناءات القادمة
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'   # نفس نسخة الجهاز المحلي (flutter --version)
          channel: 'stable'
          cache: true

      # 3. تحميل الحزم
      - name: Install dependencies
        run: flutter pub get

      # 4. Lint - يفحص جودة الكود وينبهك على مشاكل قبل ما توصل production
      - name: Analyze code
        run: flutter analyze

      # 5. تشغيل الاختبارات (unit/widget tests اللي عندك بمجلد test/)
      - name: Run tests
        run: flutter test

      # 6. بناء نسخة APK تجريبية (debug) - سريعة للتأكد إنه ما في كسور بالكود
      - name: Build APK (debug)
        run: flutter build apk --debug

      # 7. إعادة بناء ملف الـ keystore من الـ secret (لا ينحفظ بالكود أبداً)
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/baby-vax-release-key.jks

      # 8. إعادة بناء key.properties من الـ secrets وقت التنفيذ فقط
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=baby-vax-release-key.jks" >> android/key.properties

      # 9. بناء نسخة release موقعة (AAB - الصيغة المطلوبة لـ Google Play)
      - name: Build release AAB
        run: flutter build appbundle --release

      # 10. بناء نسخة release APK أيضاً (مفيدة للتجربة اليدوية خارج Play Store)
      - name: Build release APK
        run: flutter build apk --release

      # 11. حفظ النسختين الموقعتين كـ artifacts تقدر تنزلهم من صفحة الـ Action
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
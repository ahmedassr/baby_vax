name: CI

# يشتغل مع كل push أو Pull Request على main، وأيضاً يدوياً من تبويب Actions لو حبيت
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Analyze, Test, Build APK
    runs-on: ubuntu-latest   # Linux runner كافي لـ Android، أرخص وأسرع من macOS

    steps:
      # 1. تحميل الكود
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت Flutter SDK وعمل cache تلقائي لتسريع البناءات القادمة
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'   # عدّلها لنفس نسخة Flutter اللي تستخدمها محلياً (flutter --version)
          channel: 'stable'
          cache: true

      # 3. تحميل الحزم
      - name: Install dependencies
        run: flutter pub get

      # 4. Lint - يفحص جودة الكود وينبهك على مشاكل قبل ما توصل production
      - name: Analyze code
        run: flutter analyze

      # 5. تشغيل الاختبارات (unit/widget tests اللي عندك بمجلد test/)
      - name: Run tests
        run: flutter test

      # 6. بناء نسخة APK (بدون توقيع release بعد - هاي مرحلة لاحقة)
      - name: Build APK (debug)
        run: flutter build apk --debug

      # 7. حفظ الـ APK كـ artifact تقدر تنزله من صفحة الـ Action نفسها للفحص
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
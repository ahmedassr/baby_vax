name: baby_vax
description: "Baby Vax - a child vaccination schedule tracker with offline reminders."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.5.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  # Removed as unused (nothing in lib/ or test/ imports them), which drops
  # their native code, dex and bundled files from every install:
  # cupertino_icons (its 252 KB font was bundled though no CupertinoIcons are
  # used; CupertinoActivityIndicator and CupertinoSliverRefreshControl are
  # painted, not drawn from the font), smooth_page_indicator, fluttertoast,
  # flutter_localization, flutter_svg, shared_preferences (get_storage is
  # the app's key-value store).
  # v1.1 also removed auto_size_text (its one user, KeyValueRichText, was
  # dead code), shimmer (AppLoading pulses one opacity instead) and
  # flutter_screenutil (sizes are logical pixels; see AppSpacing).
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  intl: ^0.20.0
  lottie: ^3.2.0
  get: ^4.7.2
  google_fonts: ^9.0.0
  get_storage: ^2.1.1
  logger: ^2.6.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  firebase_crashlytics: ^6.0.1
  firebase_app_check: ^0.5.1
  # v1.1 vaccination card: the PDF is drawn on the device (pdf, pure Dart)
  # and handed to Android's share / print sheet (printing). No network, no
  # server. Both Apache-2.0, 160/160 pub points.
  pdf: ^3.13.1
  printing: ^5.15.1





# Branding. Sources are the SVGs in assets/branding/; the PNGs next to them
# in assets/branding/png/ are exported from those SVGs and are what these
# two generators read. Neither folder is bundled into the app (see the
# assets list below). Regenerate with:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/png/app-icon.png"
  # Adaptive icon (Android 8+): solid brand-dark background, mark inside
  # the 66dp safe zone, and a monochrome layer for Android 13 themed icons.
  adaptive_icon_background: "#2E7324"
  adaptive_icon_foreground: "assets/branding/png/adaptive-foreground.png"
  adaptive_icon_monochrome: "assets/branding/png/adaptive-monochrome.png"
  remove_alpha_ios: true

flutter_native_splash:
  # The palette's scaffold colours (AppPalette), so the native splash hands
  # over to the Flutter splash without a flash of a different colour.
  color: "#F7F9F7"
  color_dark: "#121417"
  image: assets/branding/png/splash-legacy.png

  android_12:
    image: assets/branding/png/splash-android12.png
    color: "#F7F9F7"
    color_dark: "#121417"

  android: true
  ios: true
  web: false


dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  # Build-time generator only (`dart run flutter_launcher_icons`), so it
  # belongs here rather than in the app's dependencies.
  flutter_launcher_icons: ^0.14.2
  # Tests only: pins the bundled font's SHA-256 (already a transitive dep).
  crypto: ^3.0.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # Listed file by file rather than `- assets/`, so build-time source images
  # are not shipped to users:
  #  - assets/branding/       SVG sources and their exported PNGs, read by
  #                            flutter_launcher_icons / flutter_native_splash
  #                            at build time; the app shows app_logo.webp,
  #                            a lossless export of branding/logo.svg
  # test/assets/asset_references_test.dart fails if code references a file
  # that is not listed here, or if a listed file is never referenced.
  #  - assets/google_fonts/    Cairo, bundled so it is never fetched at
  #                            runtime; see lib/app/config/themes/app_fonts.dart
  assets:
    - assets/app_logo.webp
    - assets/animations/no_records.json
    - assets/google_fonts/Cairo-Regular.ttf
    - assets/google_fonts/OFL.txt

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
